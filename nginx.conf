worker_processes auto;
daemon off;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 65;

    # Gzip compressie: kleinere payloads => snellere response over de wire
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpg jpeg;
        image/png                             png;
        image/svg+xml                         svg svgz;
        image/x-icon                          ico;
        image/webp                            webp;
        application/javascript                js mjs;
        application/json                      json;
        application/pdf                       pdf;
        application/x-font-ttf                ttf;
        application/x-font-opentype           otf;
        application/vnd.ms-fontobject         eot;
        application/font-woff                 woff;
        application/font-woff2                woff2;
        application/octet-stream              bin;
    }

    server {
        listen 0.0.0.0:__PORT__;
        server_name _;

        root /app/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Livewire serveert zijn JS/CSS via een dynamische route (/livewire-<hash>/...),
        # dus die slepen we dóór naar PHP (index.php) in plaats van als statisch bestand.
        # '^~' zorgt dat deze prefix-locatie voorrang heeft op de regex-blocks hieronder.
        location ^~ /livewire- {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Echte statische assets (uit /public) serveren we direct met lange cache.
        # Het Livewire-pad (/livewire-...) wordt hierboven apart afgehandeld en
        # omzeilt dit block; ontbrekende statische bestanden krijgen een 404.
        location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            try_files $uri =404;
            fastcgi_param  QUERY_STRING       $query_string;
            fastcgi_param  REQUEST_METHOD     $request_method;
            fastcgi_param  CONTENT_TYPE       $content_type;
            fastcgi_param  CONTENT_LENGTH     $content_length;
            fastcgi_param  SCRIPT_NAME        $fastcgi_script_name;
            fastcgi_param  REQUEST_URI        $request_uri;
            fastcgi_param  DOCUMENT_URI       $document_uri;
            fastcgi_param  DOCUMENT_ROOT      $document_root;
            fastcgi_param  SERVER_PROTOCOL    $server_protocol;
            fastcgi_param  REQUEST_SCHEME     $scheme;
            fastcgi_param  HTTPS              $https if_not_empty;
            fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
            fastcgi_param  SERVER_SOFTWARE    nginx/$nginx_version;
            fastcgi_param  REMOTE_ADDR        $remote_addr;
            fastcgi_param  REMOTE_PORT        $remote_port;
            fastcgi_param  SERVER_ADDR        $server_addr;
            fastcgi_param  SERVER_PORT        $server_port;
            fastcgi_param  SERVER_NAME        $server_name;
            fastcgi_param  REDIRECT_STATUS    200;
            fastcgi_param  SCRIPT_FILENAME    $document_root$fastcgi_script_name;
            fastcgi_param  PATH_INFO          $fastcgi_path_info;
        }
    }
}
