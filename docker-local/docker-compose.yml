services:
  app:
    build:
      context: ..
      dockerfile: docker-local/Dockerfile
    image: stage_urenregistratie_app
    container_name: stage_urenregistratie_app
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - D:\_Development\projects\stage-urenregistratie-app:/var/www:cached
      - laravel_storage:/var/www/storage
      - /var/www/vendor   # container-only vendor, blijft bestaan voor composer
    depends_on:
      - mysql
    command: php artisan serve --host=0.0.0.0 --port=8000

  mysql:
    image: mysql:8.0
    container_name: stage_urenregistratie_app_mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: stage_urenregistratie_app
      MYSQL_USER: stage_urenregistratie_app
      MYSQL_PASSWORD: stage_urenregistratie_app
      MYSQL_ROOT_PASSWORD: stage_urenregistratie_app
      MYSQL_ROOT_HOST: "%"
      # Zorg dat nieuwe users default mysql_native_password gebruiken
      MYSQL_INITDB_SKIP_TZINFO: 1
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  laravel_storage:
