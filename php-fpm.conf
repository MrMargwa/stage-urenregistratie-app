[www]
listen = 127.0.0.1:9000
user = nobody
pm = dynamic
pm.max_children = 12
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.start_servers = 4
clear_env = no
catch_workers_output = yes
request_terminate_timeout = 90
slowlog = /dev/stderr
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr
php_admin_value[display_errors] = off

; Verklap de PHP-versie niet in de X-Powered-By-header. Een scanner die ziet
; welke versie je draait, weet meteen of je kwetsbaar bent.
php_admin_flag[expose_php] = off

; Laravel gebruikt PHP's session.upload_progress nooit. Die feature was een van
; de aanvalsroutes van de PHP2Shell-lekken (CVE-2026-109619), dus hij staat uit.
; Onschadelijk voor de app, en het scheelt een onnodig aanvalsoppervlak.
php_admin_flag[session.upload_progress.enabled] = off
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 64
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.jit] = 1255
php_admin_value[opcache.jit_buffer_size] = 64M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
